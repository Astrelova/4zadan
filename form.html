<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма заявки</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; }
        input[type="text"], input[type="tel"], input[type="email"], input[type="date"], textarea, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; transition: border 0.3s; }
        input:focus, textarea:focus, select:focus { border-color: #3498db; outline: none; }
        textarea { resize: vertical; min-height: 100px; }
        .radio-group { margin-bottom: 20px; }
        .radio-group label { display: inline-block; margin-right: 20px; font-weight: normal; }
        .checkbox-group { margin-bottom: 20px; }
        .checkbox-group label { display: inline; font-weight: normal; }
        button { width: 100%; padding: 14px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        select[multiple] { height: 150px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Заявка</h1>
        <form action="form.php" method="POST">
            <label for="fullname">ФИО:</label>
            <input type="text" id="fullname" name="fullname" maxlength="150" required>

            <label for="phone">Телефон:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="birthdate">Дата рождения:</label>
            <input type="date" id="birthdate" name="birthdate" required>

            <label>Пол:</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Мужской</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Женский</label>
            </div>

            <label for="languages">Любимый язык программирования:</label>
            <select id="languages" name="languages[]" multiple required>
                <option value="1">Pascal</option>
                <option value="2">C</option>
                <option value="3">C++</option>
                <option value="4">JavaScript</option>
                <option value="5">PHP</option>
                <option value="6">Python</option>
                <option value="7">Java</option>
                <option value="8">Haskell</option>
                <option value="9">Clojure</option>
                <option value="10">Prolog</option>
                <option value="11">Scala</option>
                <option value="12">Go</option>
            </select>

            <label for="bio">Биография:</label>
            <textarea id="bio" name="bio" required></textarea>

            <div class="checkbox-group">
                <input type="checkbox" id="contract" name="contract" value="1" required>
                <label for="contract">С контрактом ознакомлен(а)</label>
            </div>

            <button type="submit">Сохранить</button>
        </form>
    </div>
</body>
</html>
